# migears/yaml-pages — a full-feature example
# ==================================================================
# This file covers every piece of yaml-pages declaration syntax. It can be
# compiled and rendered as-is, and doubles as a reference for writing your
# own pages.
#
# Structure conventions (see README "Frontend framework integration"):
#   · every node has a type field, and the type decides what the node is
#   · fields are written directly as keys; the structural child keys are
#     then/else, body, fields, columns, data, options, content
#   · framework directives and class/id/style are forwarded verbatim to the
#     generated tags
#
# Compile (the output lands in examples/views/, on the same template search
# path as the layout):
#     php bin/yaml-pages compile examples/full-featured.page.yaml examples/views
#
# Render (bundled components live in the package components/, this example's
# custom component in examples/components/):
#     $tpl = new Template(__DIR__ . '/examples/views');
#     $tpl->addPath(__DIR__ . '/components');            // built-in: card / button / alert / badge
#     $tpl->addPath(__DIR__ . '/examples/components');   // custom: my-card
#     echo $tpl->render('full-featured', $data);
#
# Note: layout and body are mutually exclusive, so they cannot both be
# demonstrated in a single file. The layout-free standalone page style is
# shown in the commented block at the end of this file.

title: User management · full-feature example
layout: layout/main
sections:
  content:
    # ======================================================
    # 1. heading / text / link — headings, text, and links
    # ======================================================

    # heading: level is optional (defaults to 1) and takes 1-6
    - type: heading
      text: Page content
    - type: heading
      level: 2
      text: 1. Headings, text, and links
    - type: heading
      level: 3
      text: Level three heading

    # text: the element text is the content; literal parts are output as-is
    # and interpolations are escaped automatically
    - type: text
      text: This is plain text.
    - type: text
      text: Hello, {{ user.name }}! You have {{ user.messageCount }} unread messages.

    # A value that starts with { must be quoted, or YAML reads it as a flow map
    - type: text
      text: '{{ user.name }} ({{ user.age }})'

    # HTML that must be emitted verbatim is written straight through — in YAML,
    # < > & are not special characters
    - type: text
      text: <strong>bold</strong> and <em>italic</em>, tags are output verbatim.

    # Multi-line text uses a YAML block scalar; |- drops the trailing newline
    - type: text
      text: |-
        First line
        Second line

    # link: href is required, text is the link label; target is optional;
    # attribute values support interpolation too
    - type: link
      href: /users/{{ user.id }}/edit
      text: Edit current user
    - type: link
      href: https://example.com/docs
      text: Open the docs in a new window
      target: _blank

    # ======================================================
    # 2. if — conditional display
    #    when is required; then is required, else is optional
    # ======================================================
    - type: heading
      level: 2
      text: 2. Conditional display

    - type: if
      when: user.loggedIn
      then:
        - type: text
          text: Welcome back, {{ user.name }}.
      else:
        - type: text
          text: Please log in.

    # Negation: a leading ! must be quoted (YAML treats ! as a tag prefix)
    - type: if
      when: '!user.hidden'
      then:
        - type: text
          text: This profile is visible to visitors.

    # A longer path also works as a condition: form.errors.email -> form['errors']['email']
    - type: if
      when: form.errors.email
      then:
        - type: text
          text: 'Email error: {{ form.errors.email }}'

    # ======================================================
    # 3. each — loop over a list
    #    items is required; body is required; as defaults to item; index is optional
    # ======================================================
    - type: heading
      level: 2
      text: 3. Loop over a list

    # index is the array key (starting at 0)
    - type: each
      items: users
      as: member
      index: i
      body:
        - type: text
          text: '{{ i }}. {{ member.name }} ({{ member.email }})'

    # Nested each: the inner items can reference an outer variable
    - type: each
      items: groups
      as: group
      body:
        - type: heading
          level: 4
          text: '{{ group.name }}'
        - type: each
          items: group.members
          as: member
          body:
            - type: text
              text: '· {{ member.name }}'

    # You can also write if inside a loop body
    - type: each
      items: users
      as: member
      body:
        - type: if
          when: member.active
          then:
            - type: text
              text: '{{ member.name }} is enabled'
          else:
            - type: text
              text: '{{ member.name }} is disabled'

    # ======================================================
    # 4. table — tables
    #    items is required; columns is required; as defaults to row; empty is optional
    #    columns: label is required, pop and content are mutually exclusive
    # ======================================================
    - type: heading
      level: 2
      text: 4. Tables

    - type: table
      items: users
      as: row
      empty: No data
      columns:
        # pop: the server renders the data into the cell, written as {{ row.<field> }}
        - label: ID
          pop: '{{ row.id }}'
        - label: Name
          pop: '{{ row.name }}'
        - label: Email
          pop: '{{ row.email }}'
        # content: a node tree in the row variable's scope, may reference row.*
        - label: Actions
          content:
            - type: link
              href: /users/{{ row.id }}/edit
              text: Edit

    # ======================================================
    # 5. form + field — forms
    #    action is required; method defaults to post; fields is required
    #    input: text / password / email / number / textarea
    #           / select / checkbox / hidden / submit
    # ======================================================
    - type: heading
      level: 2
      text: 5. Forms

    - type: form
      action: /users/save
      method: post
      fields:
        # value binds a path, required is a boolean, placeholder is for single-line inputs only
        - name: name
          label: Name
          input: text
          value: user.name
          required: true
          placeholder: Enter a name
        - name: password
          label: Password
          input: password
          required: true
        - name: email
          label: Email
          input: email
          value: user.email
        - name: age
          label: Age
          input: number
          value: user.age
        # textarea: rows defaults to 4
        - name: bio
          label: About
          input: textarea
          rows: 6
          value: user.bio
        # select: options are required, and it does not accept a value binding
        - name: role
          label: Role
          input: select
          options:
            admin: Admin
            editor: Editor
            user: Standard user
        # checkbox: checked binds a path; a truthy value emits checked
        - name: active
          label: Enabled
          input: checkbox
          checked: user.active
        # hidden: no label is rendered
        - name: csrf
          label: CSRF token
          input: hidden
          value: form.csrf
        # submit: label is the button text
        - name: submit
          label: Save
          input: submit

    # method can be omitted (defaults to post) or set explicitly to get
    - type: form
      action: /users/search
      method: get
      fields:
        - name: q
          label: Keyword
          input: text
          placeholder: Name or email
        - name: go
          label: Search
          input: submit

    # ======================================================
    # 6. component — components
    #    name is required; data is an optional map whose values support interpolation
    # ======================================================
    - type: heading
      level: 2
      text: 6. Components

    # No data: pass only the component name
    - type: component
      name: badge

    # card: title / body (body is output verbatim and may contain HTML)
    - type: component
      name: card
      data:
        title: Card title
        body: Card body, may contain an <em>HTML</em> fragment.

    # button: text / href (optional; when omitted it renders a <button>) / type
    - type: component
      name: button
      data:
        text: 'Edit {{ user.name }}'
        href: /users/{{ user.id }}/edit
        type: primary

    # alert: type (info/success/warning/danger, defaults to info) / text
    - type: component
      name: alert
      data:
        type: warning
        text: The account expires in {{ user.daysLeft }} days.

    # data values support interpolation; escaping is up to the component template
    # (here, alert's e())
    - type: component
      name: alert
      data:
        type: success
        text: Saved {{ user.messageCount }} settings.

    # my-card: this example's own custom component, file at
    # examples/components/my-card.php; the only difference from a built-in is
    # that it is not distributed inside the package. See "Custom components" at
    # the end of this file.
    - type: component
      name: my-card
      data:
        title: 'Custom component · {{ user.name }}'
        body: 'body is emitted by the component template with raw(), so an <em>HTML</em> fragment can be written here.'

    # ======================================================
    # 7. el / attribute passthrough — frontend framework integration
    #    el is a generic container; framework directives and class/id/style are
    #    output verbatim onto the tag
    # ======================================================
    - type: heading
      level: 2
      text: 7. Frontend framework integration

    # el: a generic container that gives attributes like x-data somewhere to live
    # @click is Alpine's event shorthand; a key starting with @ must be quoted
    - type: el
      tag: div
      x-data: '{ open: false }'
      class: panel
      "@click": open = ! open
      ":class": "open && 'open'"
      body:
        - type: text
          text: Click to toggle

    # Passthrough: directive names with a colon, and the x- / v- / hx- / data- prefixes
    # Keys containing a colon (x-on:click:) can be written bare; passthrough values
    # support interpolation too
    - type: el
      tag: ul
      class: list
      data-controller: menu
      body:
        - type: each
          items: users
          as: member
          body:
            - type: el
              tag: li
              data-id: '{{ member.id }}'
              x-on:click: select($el)
              body:
                - type: text
                  text: '{{ member.name }}'

    # Form fields and links accept passthrough attributes as well
    - type: form
      action: /users/search
      method: get
      class: search
      x-on:submit.prevent: submit()
      fields:
        - name: q
          label: Keyword
          input: text
          placeholder: Name or email
          x-model.debounce.500ms: kw
        - name: go
          label: Search
          input: submit


# ==================================================================
# Appendix: the layout-free standalone page mode
# ==================================================================
#
# layout and body are mutually exclusive: when layout is not written, the page
# content goes directly under body. In that case title is ignored (and a
# warning is emitted), because a standalone page has no layout to inject a
# title section into.
#
#   body:
#     - type: heading
#       level: 2
#       text: Standalone page
#     - type: text
#       text: Hello, {{ user.name }}.
#     - type: each
#       items: users
#       as: member
#       body:
#         - type: text
#           text: '{{ member.name }}'
#
#
# ==================================================================
# Appendix: custom components
# ==================================================================
#
# The my-card in section 6 above is a custom component: the file is
# examples/components/my-card.php and the page refers to it with name: my-card.
# No registration is needed — as long as its directory is addPath-ed into the
# template search path.
#
# Writing a component of your own, three steps:
#
# 1) Write the component file. A component is just an ordinary miGears
#    Template file (.php or .tpl.php both work; inside .tpl.php, ## $x ## is an
#    escaped output and ### $x ### is a raw output, and it adds another compiled
#    cache artifact):
#
#      // components/my-card.php
#      <div class="my-card">
#          <h3><?= $this->e($title ?? '') ?></h3>
#          <div><?= $this->raw((string) ($body ?? '')) ?></div>
#      </div>
#
# 2) Make its directory discoverable. Directories addPath-ed later are searched
#    first, so placing a same-named file in a later-registered directory
#    overrides a built-in (a theme override):
#
#      $tpl->addPath(__DIR__ . '/components');
#
# 3) Refer to it by name in the page:
#
#      - type: component
#        name: my-card
#        data:
#          title: '{{ user.name }}'
#          body: 'Body, may contain <em>HTML</em>.'
#
# Key points:
#   · The name is a path relative to some registered path, so subdirectories work
#     directly: name: admin/table hits <path>/admin/table.php. The same file gets
#     a different name depending on the base path: it is card when the
#     components/ directory is registered, components/card when the package root is.
#   · data keys become local variables inside the component, and values must be
#     strings; other page variables are not forwarded into the component.
#   · data values arrive unescaped; whether to escape is decided by the component
#     template: text uses $this->e(), trusted HTML uses $this->raw(). Pre-escaping
#     on the page would double-escape.
#   · a component node itself emits no tag, so it cannot carry attributes like
#     class; wrap it in an el when you need outer attributes.
#   · a missing component does not error at compile time; it only throws at
#     render time with "Component not found: <name>".