title: User management
layout: layout/main
sections:
  title:
    - type: text
      text: User management
  content:
    - type: heading
      level: 2
      text: User list
    - type: table
      items: users
      as: user
      empty: No data
      columns:
        - label: ID
          pop: '{{ user.id }}'
        - label: Name
          pop: '{{ user.name }}'
        - label: Actions
          content:
            - type: link
              href: /users/{{ user.id }}/edit
              text: Edit
