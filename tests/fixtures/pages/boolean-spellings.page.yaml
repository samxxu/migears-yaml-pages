# One contract, two source languages spell a boolean differently: YAML has the type
# (`required: true`), XML has only strings and follows HTML's boolean attributes
# (`required="yes"` is true). The artefact is the same either way, and this pair is
# in the corpus so the two spellings cannot drift into two outcomes.
body:
  - type: form
    action: /save
    fields:
      - name: q
        label: Q
        required: true
